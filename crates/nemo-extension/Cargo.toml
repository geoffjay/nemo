[package]
name = "nemo-extension"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
wasm = ["nemo-wasm"]
pkg-env = ["dep:rhai-env"]
pkg-sci = ["dep:rhai-sci"]
pkg-process = ["dep:rhai-process"]

[dependencies]
indexmap = { workspace = true }
nemo-config = { workspace = true }
nemo-registry = { workspace = true }
nemo-data = { workspace = true }
nemo-events = { workspace = true }
nemo-plugin-api = { workspace = true }
nemo-wasm = { workspace = true, optional = true }
rhai = { workspace = true }
rhai-chrono = { workspace = true }
rhai-fs = { workspace = true }
rhai-env = { workspace = true, optional = true }
rhai-sci = { workspace = true, optional = true, default-features = false }
rhai-process = { workspace = true, optional = true }
libloading = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
semver = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
