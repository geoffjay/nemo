[package]
name = "nemo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration-driven, GPU-accelerated desktop application framework"
repository.workspace = true

[[bin]]
name = "nemo"
path = "src/main.rs"

[features]
# Rhai script packages, forwarded to nemo-extension so they compile into the
# `nemo` binary. Compiling a package in is only half the gate — an app must
# still opt in per-script via `<script features="...">` — so a stock app stays
# sandboxed regardless of what is built in.
#
# `pkg-env` (env vars) and `pkg-sci` (statistics) are on by default: sci is a
# light numeric dependency and env is low-risk and still gated by the script
# `system` feature. `pkg-process` (arbitrary subprocess spawning) is left out
# of the default so a stock binary physically cannot spawn processes; enable it
# explicitly (or via `all-packages`) for apps that need it, e.g. dev-dashboard.
default = ["pkg-env", "pkg-sci"]
pkg-env = ["nemo-extension/pkg-env"]
pkg-sci = ["nemo-extension/pkg-sci"]
pkg-process = ["nemo-extension/pkg-process"]
all-packages = ["pkg-env", "pkg-sci", "pkg-process"]

# Offscreen screenshot capture (`nemo screenshot`). Turns on gpui's
# `test-support` render-to-image path (Metal drawable readback on macOS). NOT in
# `default`: test-support can change gpui codegen, so release/normal builds must
# stay feature-free. Enabling it is a feature-only change and must NOT drift the
# pinned gpui rev in Cargo.lock — verify `git diff Cargo.lock` after building.
# See docs/knowledgebase/decisions/screenshot-via-test-support-feature.md.
screenshot = ["gpui_platform/test-support"]

[dependencies]
nemo-config = { workspace = true }
nemo-registry = { workspace = true }
nemo-tokens = { workspace = true }
nemo-layout = { workspace = true }
nemo-data = { workspace = true }
nemo-extension = { workspace = true, features = ["wasm"] }
nemo-integration = { workspace = true }
nemo-events = { workspace = true }
nemo-plugin-api = { workspace = true }
nemo-macros = { workspace = true }
gpui = { workspace = true }
gpui_platform = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
gpui-router = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
dirs = { workspace = true }
notify = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
proptest = "1"

# cargo-binstall: resolve prebuilt binaries from GitHub Releases.
# The `nemo` binary is not published to crates.io (it depends on a git build of
# gpui), so this is used via `cargo binstall --git https://github.com/geoffjay/nemo nemo`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# cargo-deb: build a Debian package for x86_64/aarch64 Linux.
# Depends on the same system libraries GPUI links against at build time.
[package.metadata.deb]
maintainer = "Geoff Johnson <geoffjay@users.noreply.github.com>"
license-file = ["../../LICENSE-MIT", "0"]
extended-description = "Nemo is a configuration-driven desktop application framework. Define UI, data sources, and event handlers in XML and Nemo renders a native, GPU-accelerated application."
section = "utils"
priority = "optional"
depends = "$auto, libfontconfig1, libfreetype6, libvulkan1, libxcb1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0"
assets = [
  ["target/release/nemo", "usr/bin/", "755"],
  ["../../examples/**/*", "usr/share/nemo/examples/", "644"],
  ["../../README.md", "usr/share/doc/nemo/README.md", "644"],
]

# cargo-generate-rpm: build an RPM package for x86_64/aarch64 Linux.
# Runtime library dependencies are auto-detected from the binary's ELF
# (cargo-generate-rpm's default auto-req), which maps the needed .so names to
# the providing packages on the build distro.
[package.metadata.generate-rpm]
assets = [
  { source = "target/release/nemo", dest = "/usr/bin/nemo", mode = "755" },
]
