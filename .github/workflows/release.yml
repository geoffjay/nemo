name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: nemo
  APP_NAME: Nemo

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            arch: arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            cmake \
            build-essential \
            libxcb1-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libvulkan-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Strip 'v' prefix for version number
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create app bundle (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/bundle-macos.sh ${{ matrix.target }} ${{ steps.version.outputs.version }}

      - name: Prepare data bundle
        run: |
          chmod +x ./scripts/prepare-data-bundle.sh
          ./scripts/prepare-data-bundle.sh target/data-bundle

      - name: Package binary with data (tar.gz)
        if: runner.os != 'Windows'
        run: |
          STAGING_DIR="target/staging-${{ matrix.target }}"
          mkdir -p "$STAGING_DIR/share/nemo"

          # Copy binary
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$STAGING_DIR/"

          # Copy data bundle
          cp -r target/data-bundle/* "$STAGING_DIR/share/nemo/"

          # Create tarball
          cd "$STAGING_DIR"
          tar -czvf "../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz" .
          mv "../${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz" ../../

      - name: Package binary with data (zip, Windows)
        if: runner.os == 'Windows'
        run: |
          STAGING_DIR="target/staging-${{ matrix.target }}"
          mkdir -p "$STAGING_DIR/share/nemo"

          # Copy binary (.exe on Windows)
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" "$STAGING_DIR/"

          # Copy data bundle
          cp -r target/data-bundle/* "$STAGING_DIR/share/nemo/"

          # Create zip
          cd "$STAGING_DIR"
          7z a "../${{ env.BINARY_NAME }}-${{ matrix.target }}.zip" .
          mv "../${{ env.BINARY_NAME }}-${{ matrix.target }}.zip" ../../

      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cd target/${{ matrix.target }}/release
          zip -r ${{ env.APP_NAME }}-${{ matrix.target }}.zip ${{ env.APP_NAME }}.app
          mv ${{ env.APP_NAME }}-${{ matrix.target }}.zip ../../../

      - name: Upload binary artifact (tar.gz)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.tar.gz

      - name: Upload binary artifact (zip)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.zip

      - name: Upload app bundle artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.target }}
          path: ${{ env.APP_NAME }}-${{ matrix.target }}.zip

      - name: Install cargo-deb (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build Debian package (Linux)
        if: runner.os == 'Linux'
        run: |
          # --no-build reuses the release binary already built above.
          # cargo-deb rewrites target/release -> target/<triple>/release for --target.
          cargo deb -p nemo --no-build --target ${{ matrix.target }} --output "${{ env.BINARY_NAME }}-${{ matrix.target }}.deb"

      - name: Upload Debian package artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}-deb
          path: ${{ env.BINARY_NAME }}-${{ matrix.target }}.deb

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Contents of artifacts directory:"
          ls -la artifacts/
          echo "File details:"
          file artifacts/* || true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip *.deb > checksums.txt
          cat checksums.txt

      # Re-running a tag build should not silently clobber a published release.
      # Only allow the manual (workflow_dispatch) path to replace an existing one.
      - name: Delete existing release (if any)
        if: github.event_name == 'workflow_dispatch'
        run: gh release delete "${{ steps.version.outputs.version }}" --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Prepended above the auto-generated notes.
          body: |
            ## Installation

            **Install script (macOS / Linux):**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/geoffjay/nemo/main/scripts/install.sh | sh
            ```

            **Homebrew (macOS / Linux):**

            ```sh
            brew install geoffjay/nemo/nemo
            ```

            **Prebuilt binaries:** download the archive for your platform from the
            assets below and verify it against `checksums.txt`.

            ### macOS

            The app and binary are **not code-signed or notarized**, so Gatekeeper
            will block them on first launch. After downloading, remove the
            quarantine attribute:

            ```sh
            # App bundle (Nemo-*.zip), once moved to /Applications
            xattr -dr com.apple.quarantine /Applications/Nemo.app

            # CLI binary (nemo-*.tar.gz)
            xattr -d com.apple.quarantine ./nemo
            ```

            ### Linux

            The `.tar.gz` binary is dynamically linked. Install the runtime
            libraries (Debian/Ubuntu package names):

            ```sh
            sudo apt-get install -y libfontconfig1 libfreetype6 libvulkan1 \
              libxcb1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0
            ```

            Or install the `.deb`, which pulls these in automatically:

            ```sh
            sudo apt install ./nemo-*.deb
            ```

            ---
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/checksums.txt
