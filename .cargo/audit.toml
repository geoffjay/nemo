# cargo-audit configuration.
#
# Every advisory ignored below is in a dependency this workspace cannot (or has
# deliberately not yet) upgraded on its own — each arrives transitively through
# the gpui stack (crates.io `gpui-kit` 0.8.1, which pins the `gpui-pre` =0.3.10
# snapshot crates), or through the `wasmtime` 29.0.1 pin in nemo-wasm.
#
# Since the gpui-kit migration there are no git deps: gpui comes from crates.io
# and Cargo.lock is no longer load-bearing against git drift. Normal
# `cargo update` hygiene applies, EXCEPT that the gpui-pre snapshot family must
# stay version-aligned — gpui-kit pins =0.3.10 exactly, so `cargo update` cannot
# drift it within the lock; the family moves only with a deliberate
# gpui-kit bump. The wasmtime 29 pin remains.
#
# These are NOT "won't fix" — they are "cannot fix without a coordinated
# upstream/dependency upgrade". Re-audit and prune this list whenever the
# gpui-kit/gpui-pre stack or the wasmtime pin is bumped. See
# docs/knowledgebase/decisions/audit-ignore-transitive-advisories.md.
#
# Warnings (unmaintained/unsound/yanked: anyhow, core2, event-listener, fxhash,
# instant, memmap2, paste, rand, rustls-pemfile, rustybuzz, smartstring, spin,
# ttf-parser, tokio, zbus_names, zvariant, zvariant_derive, zstd-safe) are
# intentionally left un-ignored: cargo-audit does not fail the build on them
# (30 currently allowed), and keeping them visible is useful triage signal.

[advisories]
ignore = [
    # --- wasmtime / wasmtime-wasi 29.0.1 (incl. its zstd stack via
    # wasmtime-cache): pinned at 29.0.1 by nemo-wasm. Fix requires upgrading to
    # 36+/42+, a major host-API port. TRACKED as a follow-up (nemo runs
    # untrusted WASM plugins, so this matters — see the KB decision).
