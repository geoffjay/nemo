# GPUI comes from the gpui-pre snapshot crates that gpui-kit pins. The
# dependency KEY stays `gpui`/`gpui_platform` (the crates keep those Rust lib
# names), so `use gpui::*` and `gpui_platform::application()` are unchanged.
[workspace]
resolver = "2"
members = [
  "crates/nemo",
  "crates/nemo-config",
  "crates/nemo-registry",
  "crates/nemo-tokens",
  "crates/nemo-layout",
  "crates/nemo-data",
  "crates/nemo-extension",
  "crates/nemo-integration",
  "crates/nemo-events",
  "crates/nemo-plugin-api",
  "crates/nemo-plugin",
  "crates/nemo-macros",
  "crates/nemo-phosphor",
  "crates/nemo-wasm",
  "crates/nemo-wasm-guest",
  "plugins/mock-data",
  "plugins/mock-data-wasm",
  "plugins/pid-control",
  "plugins/streaming-stats",
  "plugins/demo-settings",
  "xtask",
]

[workspace.package]
version = "0.9.4"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/geoffjay/nemo"

[workspace.dependencies]
# GPUI, via the GPUI Kit umbrella crate (crates.io). `gpui-kit` pins the
# `gpui-pre`/`gpui-pre-platform` snapshot crates exactly (`=0.3.10`), which keep
# the Rust lib names `gpui`/`gpui_platform`, so `use gpui::*` and
# `gpui_platform::application()` are unchanged. The `tree-sitter-languages`
# feature supplies syntax highlighting for the code editor component.
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
  "font-kit",
  "x11",
  "wayland",
] }
gpui-kit = { version = "0.8.1", features = ["tree-sitter-languages"] }
gpui-router = { version = "0.7", default-features = false, features = [
  "gpui-pre",
] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3.32"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }

# Configuration
quick-xml = "0.37"
toml = "0.8"
dirs = "6"

# Scripting
rhai = "1.19"
rhai-chrono = "0.1"
rhai-fs = "0.1"
rhai-env = "0.1"
rhai-sci = { version = "0.3", default-features = false }
rhai-process = "0.1"

# Plugin loading
libloading = "0.8"

# WASM
wasmtime = { version = "29", features = ["component-model"] }
wasmtime-wasi = "29"
wit-bindgen = "0.36"

# Networking
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.24"

# Messaging
rumqttc = "0.24"
redis = { version = "0.27", features = ["tokio-comp"] }
async-nats = "0.37"

# File watching
notify = "6"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
indexmap = { version = "2", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive", "env"] }

# Internal crates
nemo-config = { path = "crates/nemo-config" }
nemo-registry = { path = "crates/nemo-registry" }
nemo-tokens = { path = "crates/nemo-tokens" }
nemo-layout = { path = "crates/nemo-layout" }
nemo-data = { path = "crates/nemo-data" }
nemo-extension = { path = "crates/nemo-extension" }
nemo-integration = { path = "crates/nemo-integration" }
nemo-events = { path = "crates/nemo-events" }
nemo-plugin-api = { version = "0.9.1", path = "crates/nemo-plugin-api" }
nemo-plugin = { version = "0.9.1", path = "crates/nemo-plugin" }
nemo-macros = { path = "crates/nemo-macros" }
nemo-phosphor = { path = "crates/nemo-phosphor" }
nemo-wasm = { path = "crates/nemo-wasm" }
